  draft_title: 'Working draft'
  draft_description: 'Hosting, provider and data retention details still need to be completed and checked before the website is published.'
  contact_notice: 'ROAMING uses this form to answer your enquiry and, where relevant, prepare your stay. Fields marked with an asterisk are required; your phone number is optional. To exercise your data rights: contact@roamingfr.com. Read our'
  fields:
    company: 'Company name'
    form: 'Legal form'
