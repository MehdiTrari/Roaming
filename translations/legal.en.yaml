    host_phone: 'Hosting company phone'
    contact_retention: 'Contact messages, email copies and backups'
    logs_retention: 'Technical and security logs'
    team_retention: 'Team accounts, tickets and screenshots'
  notice:
    title: 'Legal notice'
    publisher: 'Website publisher'
    intro: 'Roaming Lille presents properties and stay services offered by the following company.'
    hosting: 'Hosting'
    hosting_note: 'The contracting entity, address and phone number must be confirmed from the hosting agreement. The host’s registered office does not, by itself, identify the data centre country.'
    host_contact: 'Provider contact'
    content_title: 'Content and intellectual property'
    content: 'Text, photographs, trademarks and graphics are protected according to their respective rights. Displaying them on this website does not grant a licence to reuse them. Contact ROAMING about reproduction requests. Third-party trademarks belong to their respective owners.'
    booking_title: 'Availability and reservations'
    booking: 'Availability and price estimates are requested from GuestLucky and may change. A search or quote is not a confirmed booking. Please review stay conditions, final prices, payment and cancellation terms when booking through the relevant service.'
    data_title: 'Personal data'
    data: 'Information about data processing and your rights is set out in our'
  privacy:
    title: 'Privacy policy'
    short_title: 'Privacy'
    intro: 'This page explains how information is used when you browse Roaming Lille, search for a stay, contact the team or use its private workspace.'
    controller_title: 'Who is responsible for your data?'
    contact: 'Contact for privacy questions and requests concerning your personal data:'
    purposes_title: 'What data is used, and why?'
    basis: 'Legal basis:'
    contact_title: 'Answering your enquiry'
    contact_data: 'The form collects your name, email, subject, message and submission date. Your phone number is optional. Required fields are marked; without them, the form cannot be submitted. Messages are stored in the website database and sent to the team by email. Avoid including sensitive information or identity documents.'
    contact_basis: 'steps taken at your request before entering into a stay contract; ROAMING’s legitimate interest in answering other enquiries.'
    search_title: 'Searching for a stay'
    search_data: 'Your selected property, dates and number of guests are used to request availability and prices from GuestLucky. They also appear in the page address to preserve your search and may therefore appear in browser history and technical logs. This search does not ask for your name or email. Availability requests pass through the website server.'
    search_basis: 'steps taken at your request before entering into a contract.'
    booking_title: 'Continuing a booking with GuestLucky'
    booking_data: 'The embedded module only loads after your permission and an opening action. Your browser then contacts GuestLucky, which receives your IP address, technical connection information and stay criteria. Information entered into its form is processed by that service for the booking, under the information it provides. Roaming does not collect bank card details in its contact or search form.'
    booking_basis: 'precontractual steps and then performance of a contract for the booking; consent to activate the embedded external service and any relevant non-essential trackers.'
    security_title: 'Operating and securing the website'
    map_title: 'Displaying property locations'
    map_data: 'Public property addresses and verified coordinates position the markers. After permission, your browser loads map tiles from OpenFreeMap (Hyperknot Software Kft.), which receives your IP address, requested tiles and this website’s origin, without stay criteria from the URL. Roaming does not request your geolocation. Directions voluntarily opens Google Maps with the property address; that service provides its own privacy information.'
    map_basis: 'consent to activate the external map background. Withdrawing this choice does not block access to addresses or directions links.'
    security_data: 'Technical information such as IP addresses, request dates, requested pages and errors may be processed in server and hosting logs. Sessions and form protection mechanisms help prevent abusive access and fraudulent submissions.'
    security_basis: 'ROAMING’s legitimate interest in protecting the website, its users and services.'
    team_title: 'Managing the private team workspace'
    team_data: 'Authorised accounts contain a name, email, roles and a hashed password. Tickets may include an author, comments, a screenshot and technical browsing context. This information supports issue tracking and internal exchanges. Avoid attaching guest information in screenshots.'
    team_basis: 'ROAMING’s legitimate interest in managing access to its tools and fixing website issues.'
    recipients_title: 'Who may receive your information?'
    recipients: 'Depending on the service used, recipients are authorised ROAMING staff and necessary providers: Hostinger hosting at launch, email and technical support providers, and GuestLucky for searches and bookings. After your permission, OpenFreeMap (Hyperknot Software Kft.) receives map tile requests. The Directions link voluntarily takes you to Google Maps. Email providers and their terms must be confirmed before publication. The current code implements neither targeted advertising nor automatic newsletter subscriptions.'
    retention_title: 'How long is information kept?'
    retention_intro: 'The periods below must cover website data, email copies, backups and provider data. The current version does not automatically delete messages or tickets: retention periods and procedures must be defined before publication. Booking records or information required by law follow separate rules, to be specified in the booking service’s documents.'
    choice_retention: 'Up to 180 days in this browser for each service, then permission is requested again before loading it. GuestLucky and map choices have independent expiry dates.'
    transfers_title: 'Hosting and international transfers'
    transfers_pending: 'The Hostinger server country, GuestLucky and email processing locations, subcontractors and any transfers outside the European Economic Area still need to be checked against contracts. Enabling the map also involves OpenFreeMap (Hyperknot Software Kft.) infrastructure; directions open Google Maps. This draft cannot guarantee storage exclusively in France or the European Union. Locations and applicable safeguards must be specified before publication.'
    rights_title: 'Your rights'
    rights: 'Depending on the processing and the conditions provided by the GDPR, you may request access, correction, erasure, restriction, object to certain processing and request portability of relevant data. Where processing relies on consent, you may withdraw it for the future without affecting earlier lawful processing.'
    exercise: 'To exercise your rights, email'
    response: 'A response is normally provided within one month. An extension of two months may be needed because of complexity or the number of requests; you will be informed within the first month. Appropriate proof may be requested if there are reasonable doubts about your identity.'
    complaint: 'You may also lodge a complaint with the French data protection authority,'
    cookies: 'Details about storage on your device and available controls can be found on our'
  cookies:
    title: 'Cookies'
    preferences: 'Cookies and external services'
    intro: 'The website uses technical mechanisms to operate and remember your choices. The current version includes no advertising or audience analytics tools. The GuestLucky booking module and OpenFreeMap background have separate choices.'
    dialog_description: 'Essential features remain available. Choose which external services to allow: GuestLucky booking and the OpenFreeMap background.'
    essential: 'Essential features'
    essential_short: 'Form security, session, language and your chosen theme. These features support the service you request.'
    always_active: 'Always active'
    essential_text: 'These mechanisms support the requested service and are not used for advertising tracking. Their strictly necessary use does not depend on advertising consent. Information about trackers also covers local storage.'
    session: 'Website session'
    session_text: 'A Symfony session cookie supports language, forms and team authentication. The cookie is intended for the browser session; the application’s technical inactivity lifetime is set to 8 hours. Session restoration also depends on your browser.'
    csrf: 'Form protection'
    csrf_text: 'Security tokens and, when necessary, a temporary CSRF protection cookie. The cookie generated by the form is deleted after submission.'
    theme: 'Theme preference'
    theme_text: 'The local “theme” key remembers your chosen light or dark theme. It remains in your browser until changed or until website storage is cleared.'
    choice: 'Privacy choice'
    choice_text: 'The local “roaming.privacy.v1” key for GuestLucky and “roaming.maps.v1” for maps separately remember permission or refusal, version and choice date for up to 180 days. They do not track you across websites. Allowing the map does not extend GuestLucky permission.'
    guestlucky: 'GuestLucky module'
    guestlucky_short: 'An external booking service which may use its own cookies and receive technical information. Loaded only at your request, after permission.'
    guestlucky_text: 'The GuestLucky iframe is not created and no navigation to the external module starts before your permission. Once enabled, the service may apply its own storage rules; please read the privacy information presented by GuestLucky. Module permission does not authorise advertising tools that might later be added to this website.'
    external_link: 'You may also open the booking in a new tab without allowing embedding here. This is a voluntary visit to an external website with its own privacy information and choices. Server-side availability searches remain available without permitting the iframe.'
    control_title: 'Changing or withdrawing your choice'
    control: 'The “Cookies” link at the bottom of pages lets you change your choices at any time. You can withdraw GuestLucky or map permission separately by saving your choices, or refuse everything. The corresponding module or map tiles are removed from open tabs; the address and directions link remain available. This cannot delete cookies belonging to GuestLucky’s domain: use that service’s or your browser’s controls where needed. Closing preferences does not grant permission.'
    choice_duration: 'Permission and refusal are remembered for the same duration: up to 180 days. If browser storage is blocked, the choice applies within the current tab and may be requested again after reloading.'
    allowed: 'Module permitted in this browser.'
    refused: 'Module not permitted in this browser.'
    refuse: 'Refuse all'
    allow: 'Allow all'
    save: 'Save my choices'
    guestlucky_toggle: 'Allow the GuestLucky module'
    maps: 'OpenFreeMap background'
    maps_toggle: 'Allow the external map background'
    maps_short: 'Your browser receives map tiles from OpenFreeMap and shares its IP address and this website’s origin. No remote background is loaded before permission. Withdrawing it stops external display; addresses and directions remain available.'
    details: 'Understand cookies and external services'
    future_title: 'Changes to services'
    future: 'Adding analytics, advertising, video or social media tools requires a new review and, where required, separate consent before loading them. Current choices separately cover GuestLucky and the OpenFreeMap background, without permitting other services.'
    cnil_link: 'Learn about cookies from the CNIL'
