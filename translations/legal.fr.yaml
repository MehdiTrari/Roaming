  notice:
    title: 'Mentions légales'
    publisher: 'Éditeur du site'
    intro: 'Le site Roaming Lille présente les logements et les services de séjour proposés par la société suivante.'
    hosting: 'Hébergement'
    hosting_note: 'L’entité contractante, son adresse et son téléphone sont à reprendre depuis le contrat d’hébergement. Le siège de l’hébergeur ne détermine pas, à lui seul, le pays du centre de données.'
    host_contact: 'Contact du prestataire'
    content_title: 'Contenus et propriété intellectuelle'
    content: 'Les textes, photographies, marques et éléments graphiques sont protégés selon les droits applicables à chacun. Leur présence sur le site n’accorde pas de licence de réutilisation. Pour une demande de reproduction, contactez ROAMING. Les marques de services tiers restent la propriété de leurs titulaires.'
    booking_title: 'Disponibilités et réservation'
    booking: 'Les disponibilités et estimations affichées sont consultées auprès de GuestLucky et peuvent évoluer. Une recherche ou un devis ne constitue pas une réservation confirmée. Les conditions du séjour, les prix définitifs, les modalités de paiement et d’annulation doivent être consultés lors de la réservation auprès du service concerné.'
    data_title: 'Données personnelles'
    data: 'Les informations relatives aux traitements de données et à l’exercice de vos droits figurent dans la'
  privacy:
    title: 'Politique de confidentialité'
    short_title: 'Confidentialité'
    intro: 'Cette page explique quelles informations sont utilisées lorsque vous consultez Roaming Lille, recherchez un séjour, contactez l’équipe ou utilisez son espace privé.'
    controller_title: 'Qui est responsable de vos données ?'
    contact: 'Contact pour les questions de confidentialité et les demandes relatives à vos données :'
    purposes_title: 'Quelles données, pour quels usages ?'
    basis: 'Base juridique :'
    contact_title: 'Répondre à votre demande'
    contact_data: 'Le formulaire recueille votre nom, votre e-mail, l’objet et le contenu du message, ainsi que sa date d’envoi. Votre téléphone est facultatif. Les champs obligatoires sont signalés ; sans eux, le formulaire ne peut pas être envoyé. Le message est enregistré dans la base du site et transmis par e-mail à l’équipe. Évitez d’y inclure des données sensibles ou des documents d’identité.'
    contact_basis: 'mesures précontractuelles prises à votre demande pour préparer un séjour ; intérêt légitime de ROAMING à répondre aux autres questions qui lui sont adressées.'
    search_title: 'Rechercher un séjour'
    search_data: 'Le logement choisi, les dates et le nombre de voyageurs servent à consulter les disponibilités et les prix de GuestLucky. Ils figurent aussi dans l’adresse de la page pour conserver votre recherche et peuvent donc apparaître dans l’historique du navigateur et les journaux techniques. Aucun nom ni e-mail n’est demandé pour cette recherche. Les échanges de disponibilité passent par le serveur du site.'
    search_basis: 'mesures précontractuelles prises à votre demande.'
    booking_title: 'Poursuivre une réservation avec GuestLucky'
    booking_data: 'Le module intégré est chargé uniquement après votre autorisation et une action d’ouverture. Le navigateur contacte alors GuestLucky, qui reçoit notamment votre adresse IP, les données techniques de connexion et les critères du séjour. Les informations saisies dans son formulaire sont traitées par ce service pour la réservation, selon les informations qu’il fournit. Le site Roaming ne collecte pas vos coordonnées bancaires dans son formulaire de contact ou de recherche.'
    booking_basis: 'mesures précontractuelles puis exécution du contrat pour la réservation ; consentement pour l’activation du service externe intégré et les traceurs non nécessaires concernés.'
    security_title: 'Assurer le fonctionnement et la sécurité'
    map_title: 'Afficher les emplacements'
    map_data: 'Les adresses publiques des logements et leurs coordonnées vérifiées positionnent les repères. La carte se charge automatiquement lorsqu’elle approche de la zone visible, sauf si vous l’avez désactivée. OpenFreeMap (Hyperknot Software Kft.) reçoit votre adresse IP, les ressources cartographiques demandées et l’origine du site, sans les critères de séjour de l’URL ni cookies envoyés par notre intégration. Ce prestataire déclare ne pas utiliser de cookies ou de technologies de suivi ; son infrastructure peut traiter des journaux techniques et recourir à un CDN. Aucun accès à votre géolocalisation n’est demandé. Vous pouvez désactiver la carte depuis ses préférences ou le lien Cookies. Le lien Itinéraire ouvre volontairement Google Maps avec l’adresse du logement ; ce service applique ses propres informations de confidentialité.'
    map_basis: 'intérêt légitime de ROAMING à présenter l’emplacement de ses logements et à faciliter leur localisation, sans suivi publicitaire. Vous pouvez vous opposer à cet affichage en désactivant la carte, tout en conservant les adresses et les liens d’itinéraire.'
    security_data: 'Des données techniques, telles que l’adresse IP, les dates de requêtes, les pages demandées et les erreurs, peuvent être traitées dans les journaux du serveur et de l’hébergeur. Les sessions et mécanismes de protection des formulaires servent notamment à prévenir les accès abusifs et les soumissions frauduleuses.'
    security_basis: 'intérêt légitime de ROAMING à protéger le site, ses utilisateurs et ses services.'
    team_title: 'Gérer l’espace privé de l’équipe'
    team_data: 'Les comptes autorisés comportent un nom, un e-mail, des rôles et un mot de passe conservé sous forme hachée. Les tickets peuvent contenir un auteur, des commentaires, une capture et un contexte technique de navigation. Ces informations servent au suivi des problèmes et aux échanges internes. Évitez de joindre des données de voyageurs dans les captures.'
    team_basis: 'intérêt légitime de ROAMING à organiser les accès à son outil et à corriger les problèmes du site.'
    recipients_title: 'Qui peut recevoir vos informations ?'
    recipients: 'Selon le service utilisé, les destinataires sont les membres habilités de ROAMING et les prestataires nécessaires : hébergement Hostinger lors de la mise en ligne, messagerie et maintenance technique, ainsi que GuestLucky pour les recherches et réservations. Lorsque la carte est affichée, OpenFreeMap (Hyperknot Software Kft.) reçoit les requêtes de fond de carte. Le lien Itinéraire vous conduit volontairement vers Google Maps. Les noms des prestataires de messagerie et leurs conditions doivent être confirmés avant publication. Le code actuel ne met en place ni publicité ciblée ni inscription automatique à une newsletter.'
    retention_title: 'Combien de temps sont-elles conservées ?'
    retention_intro: 'Les durées ci-dessous doivent couvrir les données du site, les copies dans la messagerie, les sauvegardes et les données des prestataires. La version actuelle ne réalise pas de suppression automatique des messages ou tickets : la procédure et les durées doivent être définies avant publication. Les données nécessaires à une réservation ou à une obligation légale relèvent de règles distinctes, à préciser dans les documents du service de réservation.'
    choice_retention: '180 jours au maximum sur ce navigateur, avec des échéances indépendantes : accord ou refus pour GuestLucky, préférence d’affichage pour la carte. À expiration, GuestLucky nécessite un nouvel accord et la carte reprend son affichage par défaut.'
    transfers_title: 'Hébergement et transferts internationaux'
    transfers_pending: 'Le pays du serveur Hostinger, les lieux de traitement de GuestLucky et de la messagerie, leurs sous-traitants et les éventuels transferts hors de l’Espace économique européen restent à vérifier sur les contrats. L’activation de la carte fait aussi intervenir l’infrastructure d’OpenFreeMap (Hyperknot Software Kft.) ; l’itinéraire ouvre le service Google Maps. Cette version ne permet pas de garantir une conservation exclusivement en France ou dans l’Union européenne. Les lieux et les garanties applicables devront être précisés avant publication.'
    rights_title: 'Vos droits'
    rights: 'Selon le traitement et les conditions prévues par le RGPD, vous pouvez demander l’accès à vos données, leur rectification, leur effacement, la limitation de leur utilisation, vous opposer à certains traitements et demander la portabilité des données concernées. Lorsque le traitement repose sur votre consentement, vous pouvez le retirer pour l’avenir sans remettre en cause l’utilisation antérieure licite.'
    exercise: 'Pour exercer vos droits, écrivez à'
    response: 'Une réponse est apportée en principe sous un mois. Une prolongation de deux mois peut être nécessaire selon la complexité ou le nombre de demandes ; vous en êtes alors informé dans le premier mois. Un justificatif adapté peut être demandé en cas de doute raisonnable sur votre identité.'
    complaint: 'Vous pouvez également adresser une réclamation à la'
    cookies: 'Le détail du stockage sur votre appareil et les commandes de gestion sont accessibles sur la page'
  cookies:
    title: 'Cookies'
    preferences: 'Cookies et services externes'
    banner_title: 'Vos choix de cookies'
    banner_description: 'Les cookies essentiels font fonctionner le site. Avec votre accord, GuestLucky peut charger le module de réservation et ses cookies. Vous gardez le choix.'
    banner_request: 'Pour ouvrir le module de réservation ici, autorisez GuestLucky. Vous pouvez aussi réserver dans un nouvel onglet sans activer le module intégré.'
    banner_details: 'En savoir plus'
    customize: 'Personnaliser'
    intro: 'Le site utilise des mécanismes techniques pour fonctionner et mémoriser vos choix. Aucun outil publicitaire ou de mesure d’audience n’est intégré dans la version actuelle. Le module de réservation GuestLucky et la carte OpenFreeMap disposent de choix séparés.'
    dialog_description: 'Le module GuestLucky nécessite votre autorisation. La carte OpenFreeMap s’affiche automatiquement sans suivi publicitaire déclaré ; vous pouvez la désactiver ici. Les deux réglages sont indépendants.'
    essential: 'Fonctions essentielles'
    essential_short: 'Sécurité des formulaires, session, langue et thème choisi. Ces fonctions servent au service que vous demandez.'
    always_active: 'Toujours actives'
    essential_text: 'Ces mécanismes assurent le service demandé et ne servent pas au suivi publicitaire. Leur usage strictement nécessaire ne dépend pas d’un accord publicitaire. Le stockage local est également concerné par l’information sur les traceurs.'
    session: 'Session du site'
    session_text: 'Cookie de session Symfony pour la langue, les formulaires et, pour l’équipe, l’authentification. Le cookie est prévu pour la session du navigateur ; la durée technique d’inactivité côté application est configurée à 8 heures. La restauration de session dépend aussi du navigateur.'
    csrf: 'Protection des formulaires'
    csrf_text: 'Jetons de sécurité et, lorsque nécessaire, cookie temporaire de protection CSRF. Le cookie généré par le formulaire est supprimé après son envoi.'
    theme: 'Préférence de thème'
    theme_text: 'La clé locale « theme » mémorise le thème clair ou sombre que vous choisissez. Elle reste sur votre navigateur jusqu’à sa modification ou l’effacement du stockage du site.'
    choice: 'Choix de confidentialité'
    choice_text: 'La clé locale « roaming.privacy.v1 » mémorise votre accord ou refus pour GuestLucky. « roaming.maps.v1 » enregistre uniquement une préférence d’affichage que vous modifiez pour la carte. Chaque choix contient sa version et sa date, pendant 180 jours maximum, sans suivi entre sites. Le chargement automatique de la carte n’enregistre aucun accord et ne prolonge jamais GuestLucky.'
    guestlucky: 'Module GuestLucky'
    guestlucky_short: 'Service de réservation externe, susceptible d’utiliser ses propres cookies et de recevoir des données techniques. Chargé uniquement à votre demande, après autorisation.'
    guestlucky_text: 'L’iframe GuestLucky n’est pas créée et aucune navigation vers le module externe n’est lancée avant votre autorisation. Une fois activé, ce service peut appliquer ses propres règles de stockage ; consultez les informations de confidentialité présentées par GuestLucky. L’autorisation du module n’autorise pas des outils publicitaires qui seraient ajoutés ultérieurement au site.'
    external_link: 'Vous pouvez aussi ouvrir la réservation dans un nouvel onglet sans autoriser l’intégration ici. Il s’agit alors d’une navigation volontaire vers un site externe, soumis à ses propres informations et choix de confidentialité. Les recherches de disponibilités côté serveur restent utilisables sans autoriser l’iframe.'
    control_title: 'Modifier ou retirer votre choix'
    control: 'Les liens « Cookies » et « Gérer les services externes » permettent de modifier vos réglages à tout moment. Vous pouvez retirer votre accord GuestLucky et désactiver séparément la carte, puis enregistrer, ou tout refuser. Le module ou la carte concernés sont retirés des onglets ouverts ; adresses et itinéraires restent disponibles. Cela ne supprime pas les cookies du domaine GuestLucky : utilisez les commandes de ce service ou du navigateur si nécessaire. Fermer les préférences ne donne aucun accord GuestLucky.'
    choice_duration: 'Les décisions GuestLucky et les préférences de carte modifiées sont conservées pendant 180 jours maximum, avec des échéances indépendantes. Sans préférence de carte valide, son affichage est automatique ; sans accord GuestLucky valide, son module reste bloqué. Si le stockage est indisponible, vos modifications valent pour l’onglet courant.'
    allowed: 'Module autorisé sur ce navigateur.'
    refused: 'Module non autorisé sur ce navigateur.'
    refuse: 'Tout refuser'
    allow: 'Tout accepter'
    save: 'Enregistrer mes choix'
    guestlucky_toggle: 'Autoriser le module GuestLucky'
    maps: 'Carte OpenFreeMap'
    maps_toggle: 'Afficher la carte OpenFreeMap'
    maps_short: 'Affichage automatique à proximité de la zone visible. OpenFreeMap reçoit votre IP et l’origine du site et déclare ne pas utiliser de cookies ni de suivi publicitaire. Notre intégration ne lui envoie pas de cookies. Désactiver ce réglage arrête les chargements de carte ; adresses et itinéraires restent disponibles.'
    details: 'Comprendre les cookies et les services externes'
    future_title: 'Évolution des services'
    future: 'L’ajout d’outils de statistiques, de publicité, de vidéo ou de réseaux sociaux nécessite une nouvelle vérification et, lorsque requis, un consentement distinct avant leur chargement. Les choix présents couvrent séparément GuestLucky et la carte OpenFreeMap, sans autoriser d’autres services.'
    cnil_link: 'En savoir plus sur les cookies auprès de la CNIL'
