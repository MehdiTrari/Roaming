# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.default_locale: 'fr'
    app.supported_locales: ['en', 'fr']
    app.hostname: '%env(APP_HOSTNAME)%'
    # Owner exception: keep Lambersart's existing local photos.
    app.guestlucky_photo_preserved_ids: [2475]

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Locale subscriber to apply session locale on each request
    App\EventSubscriber\LocaleSubscriber:
        arguments:
            $defaultLocale: '%app.default_locale%'

    # Exception subscriber for 404 handling and redirects
    App\EventSubscriber\ExceptionSubscriber:
        arguments:
            $kernelEnvironment: '%kernel.environment%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Integration\GuestLucky\GuestLuckyClient:
        arguments:
            $baseUrl: '%env(GUESTLUCKY_BASE_URL)%'
            $bookingKey: '%env(GUESTLUCKY_BOOKING_KEY)%'

    App\Service\AvailabilityService:
        arguments:
            $cache: '@cache.app'
            $enabled: '%env(bool:GUESTLUCKY_AVAILABILITY_ENABLED)%'

    # Dedicated untraced client: private bearer credentials never enter web profiler traces.
    guestlucky.mcp.http_client:
        class: Symfony\Component\HttpClient\NativeHttpClient

    App\Integration\GuestLucky\McpClient:
        arguments:
            $mcpHttpClient: '@guestlucky.mcp.http_client'
            $mcpUrl: '%env(GUESTLUCKY_MCP_URL)%'
            $mcpToken: '%env(GUESTLUCKY_MCP_TOKEN)%'

    App\Integration\GuestLucky\PhotoClient:
        arguments:
            $mediaHttpClient: '@guestlucky.mcp.http_client'
            $baseUrl: '%env(GUESTLUCKY_BASE_URL)%'
            $bookingKey: '%env(GUESTLUCKY_BOOKING_KEY)%'
